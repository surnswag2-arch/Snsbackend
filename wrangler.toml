name = "sur-swag-backend"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# ── Non-secret config. Use `wrangler secret put` for all keys/tokens. ──

[vars]
SUPABASE_URL = "https://zhfovsikgvsjvordjpha.supabase.co"
R2_BUCKET_NAME = "sur-swag-raw-uploads"
DEFAULT_LOCALE = "bn"
REGIONS = "south-asia,east-asia,us-east,us-west"
UPSTASH_REDIS_URL = ""
MEILISEARCH_URL = ""

[[r2_buckets]]
binding = "R2_UPLOADS"
bucket_name = "sur-swag-raw-uploads"

[[durable_objects.bindings]]
name = "DM_ROOM"
class_name = "DMRoom"

[[durable_objects.bindings]]
name = "LIVE_ROOM"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_classes = ["DMRoom", "LiveRoom"]
